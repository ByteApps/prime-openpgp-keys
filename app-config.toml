# Foundation application configuration
app-name = "prime-pgp-keychain"
friendly-app-name = "PGP Keychain"
launcher-app-name = "PGP Keychain"
description = "Create, import, inspect and edit OpenPGP keys: armored .asc import/export, expiration, user IDs and passphrase management."
icon = "resources/icon.svg"
app-id = "0xb0c9c9897464be18503b7522acb7621e"
version = "0.1.0"
min-keyos-version = "1.0.0"

[publisher]
name = ""
contact-email = ""
support-url = ""

[permissions]
template = ["gui-app", "fs-generic", "fs-access"]
# Seed-derived PGP keys: HMAC-derived per-app seed from the wallet master
# seed (PIN-gated on hardware; kernel-attested app identity).
"os/security" = ["GetAppSeed"]
