[package]
name = "pgp-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Pure-Rust OpenPGP (rpgp). Pinned: >= 0.19.0 is required (CVE-2026-21895,
# panic parsing crafted RSA secret-key packets — we parse untrusted .asc).
# No default features: drops bzip2 message decompression, irrelevant for
# key management. No C deps, no rayon, so it cross-compiles like hayro/image.
pgp = { version = "=0.20.0", default-features = false, features = ["draft-pqc"] }
rand = "0.8"
# Same version rpgp uses — only pulled in for the PublicKeyParts trait so we
# can report RSA modulus sizes; cargo unifies it with rpgp's copy.
rsa = { version = "0.9", default-features = false }
# Seed-derived keys: HKDF-SHA256 expands the device app-seed into a
# per-key-index seed for a deterministic ChaCha20 stream (rand 0.8 family,
# matching the Rng bound rpgp's generate() takes).
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
rand_chacha = "0.3"

[dev-dependencies]
# Entropy tests (tests/entropy.rs, tests/rng_backend.rs) exercise the two
# real RNG sources the keygen path uses directly. Same versions already
# resolved via `pgp`/`rand_core` in Cargo.lock — do not bump either major
# here without re-running the supply-chain guard in tests/rng_backend.rs.
getrandom = "0.2"
rand = "0.8"
# Parses `cargo metadata --format-version 1` JSON for the dependency-graph
# guard in tests/rng_backend.rs. Same major already resolved in Cargo.lock.
serde_json = "1"
